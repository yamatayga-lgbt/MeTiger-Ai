name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Тесты на pull request — то место, где красный прогон ещё никому не мешает:
      # в main они уже воротами перед выкладкой (см. deploy.yml), а здесь видно
      # поломку до того, как ветка уехала.
      - run: npm test
