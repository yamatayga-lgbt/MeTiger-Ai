name: Smoke prod

# Дымовой тест живого сайта (план обгона DeepSeek, волна 1, пункт 5).
#
# Три пайплайна отвечают на три разных вопроса, и этот — на третий:
#   Deploy  — «наша сборка уехала?»
#   Watch prod — «то, что на проде, вообще наше?»
#   Smoke prod — «агент на проде отвечает: текстом, картинкой, файлом?»
#
# Последний важнее, чем кажется: ключи провайдеров, квоты и поиск живут в
# окружении Cloudflare, а не в репозитории. Там может кончиться квота или
# протухнуть ключ — тесты и сборка этого не увидят, а человек увидит «сервис не
# отвечает». Проверяем настоящими ходами, а не чтением статики.
#
# Расписание — не на круглом часе: в :00 у GitHub собирается очередь.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  # После каждой выкладки — убедиться, что новый прод умеет отвечать.
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    # После выкладки — только если выкладка прошла; по расписанию и вручную — всегда.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Сеть и ключи не нужны: скрипт стучится в живой адрес, а ключи провайдеров
      # живут в окружении Cloudflare — до них отсюда не дотянуться, и это правильно.
      - name: Три хода на живом сайте
        run: node scripts/smoke-prod.mjs

      - name: 🚨 Тревога — задача в репозитории
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE='🚨 Прод не отвечает: дымовой тест не прошёл'
          {
            echo 'Дымовой тест сделал на <https://metiger-ai.pages.dev> три настоящих хода — текст, картинка, файл — и хотя бы один не прошёл.'
            echo
            echo '**Что это значит.** Либо движок не отвечает (кончились квоты, протух ключ провайдера, упал Cloudflare), либо сломалась генерация картинок/файлов.'
            echo
            echo '**Что посмотреть.** 1) Итог этого прогона: там видно, какой именно ход упал и что ответил сервер. 2) Проверьте руками в приложении: задайте любой вопрос и попросите картинку. 3) Экран «Использование и Лимиты» в приложении покажет, кто из провайдеров жив, а у кого кончилась квота.'
            echo
            echo '**Чего это НЕ значит.** Что у людей сейчас ничего не работает: тест ходит из одного адреса GitHub, и одиночная сетевая заминка выглядит так же, как поломка. Если следующий прогон (через сутки или после выкладки) снова красный — это уже настоящая поломка.'
            echo
            echo "Время: $(date -u +'%Y-%m-%d %H:%M') UTC · прогон: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/body.md

          EXIST=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body-file /tmp/body.md
            echo "тревога добавлена в задачу #$EXIST"
          else
            gh issue create --title "$TITLE" --body-file /tmp/body.md
            echo "заведена новая задача"
          fi

      - name: Красное и в прогоне
        if: failure()
        run: |
          echo "::error title:Прод не отвечает::Дымовой тест не прошёл — смотрите задачу «🚨 Прод не отвечает: дымовой тест не прошёл»."
          exit 1
