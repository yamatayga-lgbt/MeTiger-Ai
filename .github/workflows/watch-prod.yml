name: Watch prod

# Сторож за продом: сходит на metiger-ai.pages.dev, соберёт последние коммиты main
# и побайтово сверит их с тем, что реально отдаётся людям (scripts/verify-prod.mjs).
#
# Зачем отдельный сторож, если выкладку делает Deploy. Тот пайплайн отвечает на
# вопрос «наша сборка уехала?». Этот — на другой: «то, что лежит на проде, вообще
# наше?». Доступ к выкладке есть у токена Cloudflare, и если он попадёт не в те
# руки, сайт можно подменить незаметно — внешне копия выглядит так же. Сверка по
# байтам это ловит: сборка детерминирована, поэтому подмена не сойдётся с
# репозиторием ни одним из последних коммитов.
#
# Что делает при тревоге: открывает задачу в этом же репозитории. Задачи — не
# украшение, а единственный способ, которым сторож может крикнуть вам на телефон:
# GitHub присылает уведомление о новой задаче, а письмо о том, что «прогон
# упал», легко не заметить. Задача обновляется, а не заводится заново, — иначе
# за сутки их наберётся четыре.
#
# Ключей и секретов не нужно: прод читается обычным GET, сборки идут локально,
# а на задачу хватает встроенного GITHUB_TOKEN. Ни один из ваших ключей здесь
# не участвует — их в этом пайплайне просто нет.
#
# Разница вердиктов (это важно, чтобы не дёргаться зря):
#   ✅ совпало с текущим main — всё в порядке;
#   🕓 совпало с прошлым коммитом — прод просто отстаёт, между правкой и выкладкой
#      это нормально, тревога не поднимается;
#   🚨 не совпало ни с одним — на проде чужая сборка, заводится задача.
#
# Расписание стоит не на круглом часе: в :00 у GitHub собирается очередь, и
# прогоны там задерживаются на десятки минут. Полезная мелочь, которая делает
# «каждые шесть часов» честнее.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # После каждой выкладки — заодно проверить, что уехало именно то, что собрали.
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — сторожу нужна история: он собирает не только текущий
      # коммит, но и предыдущие, чтобы отличить отставание от подмены.
      # С мелкой выгрузкой (по умолчанию 1 коммит) он честно скажет «не смог»,
      # но отставание от подмены уже не отличит.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Код возврата — часть договора: 0 «наш (в т.ч. отстаёт)», 1 «чужая сборка»,
      # 2 «не смог проверить». Путать 2 и 1 нельзя: «не смог» — не повод кричать
      # «подменили», а «подменили» — не повод промолчать.
      - name: Сверка прода с репозиторием
        id: check
        run: |
          set +e
          node scripts/verify-prod.mjs --commits 6 --json > /tmp/verdict.json 2> /tmp/why.txt
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/verdict.json
          cat /tmp/why.txt
          if [ "$CODE" = "2" ]; then
            echo "::warning title:Сторож не смог проверить::Сеть или сборка подвели. Это НЕ значит, что прод подменён."
          fi

      - name: 🚨 Тревога — задача в репозитории
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE='🚨 На проде сборка не из репозитория'
          {
            echo 'Сторож сверил то, что отдаёт <https://metiger-ai.pages.dev>, с посимвольной сборкой последних коммитов `main` — совпадений нет.'
            echo
            echo '```json'
            cat /tmp/verdict.json
            echo '```'
            echo
            echo '**Что это значит.** На проде лежит сборка, которой нет ни в одном из последних шести коммитов `main`. Варианты по убыванию вероятности:'
            echo
            echo '1. прод выложили из другой ветки или из другого каталога;'
            echo '2. настройки Pages переключили так, что выкладывается не `dist` этого репозитория;'
            echo '3. сайт заменили, и выкладывал кто-то посторонний.'
            echo
            echo '**Что делать.** Проверить, кто и когда выкладывал: вкладка Deployments в Cloudflare Pages покажет время и коммит последней выкладки. Если выкладок, которых вы не делали, нет — это третий вариант, и тогда до конца разбора закрывать доступ к выкладке (удалить ключ) или смотреть, кто ещё мог им воспользоваться.'
            echo
            echo '**Чего это НЕ значит.** Что кто-то прочитал ваши ключи провайдеров: Cloudflare не отдаёт значения секретов через API, они возвращаются пустыми. Но выложенный код их видит — поэтому тревогу и стоит проверять сразу, а не потом.'
          } > /tmp/body.md

          EXIST=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            { echo "Повторная сверка не сошлась снова ($(date -u +'%Y-%m-%d %H:%M') UTC)."; echo; cat /tmp/body.md; } > /tmp/cc.md
            gh issue comment "$EXIST" --body-file /tmp/cc.md
            echo "тревога добавлена в задачу #$EXIST"
          else
            gh issue create --title "$TITLE" --body-file /tmp/body.md
            echo "заведена новая задача"
          fi

      # Красный прогон — вторая попытка привлечь внимание, если задачи
      # уведомлениями не пришли.
      - name: Итог
        if: steps.check.outputs.code == '1'
        run: |
          echo "::error title:Прод не совпал с репозиторием::Смотрите задачу «🚨 На проде сборка не из репозитория»."
          exit 1
