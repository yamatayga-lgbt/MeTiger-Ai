# Отдельный конфиг для проекта-двойника. Зачем: корневой wrangler.toml описывает основной
# сайт — его сборку из dist/ и байндинг KV. `pages deploy` читает конфиг рядом, и без этого
# файла редирект-проект получил бы Functions (а вместе с ними и попытки читать память)
# вместо трёх статики. Здесь намеренно пусто: ни [vars], ни [[kv_namespaces]], ни секрета.
name = "metiger"
compatibility_date = "2026-09-30"
pages_build_output_dir = "."
