name = "metiger-ai"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-30"

# Связка хранилища с Function-рантаймом. Источник правды — этот файл, id берётся
# из «curl /accounts/{аккаунт}/storage/kv/namespaces» (не из памяти!). Wrangler
# проверяет существование неймспейса и падает, если id не тот.
# Пустая секция «[env] production = {}» из `wrangler pages download config`
# перекрывает верхний уровень — байндинг с продом тогда не применяется.
# После любой правки файла обязателен новый деплой.
[[kv_namespaces]]
binding = "MEMORY"
id = "9b4e1328fbce439db03a57fdb7971145"

# Картинки без ключей (0.177). Привязка AI даёт воркеру Cloudflare Workers AI прямо
# в рантайме: flux-1-schnell и SDXL Lightning рисуют по ней, и никакого токена
# владельцу присылать не нужно. Первый заход — «рисовать» пробуем здесь, а чужие
# каналы (Gemini, OdiRouter, Pollinations) остаются страховкой на отказ.
[ai]
binding = "AI"
