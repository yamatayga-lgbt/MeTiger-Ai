<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="description" content="MeTiger Ai — универсальный ИИ-агент в одном чате. Тексты, код, изображения, анализ документов и голосовые. Бесплатно, без установки." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>MeTiger Ai — чат с ИИ</title>
    <script>
      // Тема до первого кадра — без мигания
      (function () {
        try {
          var pref = localStorage.getItem('mt-theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
