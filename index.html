<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: клавиатура СЖИМАЕТ страницу, а не
         накрывает её. Без этого Android Chrome (108+) оставляет страницу полной
         высоты и «панорамирует» её внутри окна — смахивание вниз утаскивало весь
         кадр вместе с полем ввода (0.146). iOS параметр просто игнорирует. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta id="meta-theme-color" name="theme-color" content="#0A0A0C" />
    <meta name="description" content="MeTiger Ai — универсальный ИИ-агент в одном чате. Тексты, код, изображения, анализ документов и голосовые. Бесплатно, устанавливается на экран как приложение." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iOS не читает manifest.json для режима standalone — нужны отдельные мета-теги -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MeTiger Ai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Стартовая заставка с иконкой (0.219): iOS иначе рисует крошечный apple-touch-icon
         по центру пустого кадра. Картинки — тот же тигр, 112 CSS-пикселей, фон как у темы. -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="./icons/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="./icons/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="./icons/splash-750x1334.png" />
    <title>MeTiger Ai — чат с ИИ</title>
    <style>
      /* До бандла CSS: иначе между системной заставкой и React — пустой кадр,
         и интерфейс потом «прогружается» второй раз. */
      html, body, #root { height: 100%; margin: 0; background: #0A0A0C; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background: #f7f6f2; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0A0A0C;
      }
      html[data-theme="light"] #boot { background: #f7f6f2; }
      #boot img { width: 112px; height: 112px; display: block; }
      html[data-theme="dark"] #boot img { mix-blend-mode: screen; }
      html[data-theme="light"] #boot img { border-radius: 24px; }
    </style>
    <script>
      // Тема до первого кадра — без мигания
      (function () {
        try {
          var pref = localStorage.getItem('mt-theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <img src="./icons/icon-192.png" alt="" width="112" height="112" />
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Service worker — только он делает иконку на главном экране «приложением»,
      // а не ещё одной закладкой браузера. /api и /telegram он не трогает (см. sw.js).
      if ('serviceWorker' in navigator) {
        // Публикуем новую версию — новый sw.js ставится в фоне и сразу берёт
        // управление (skipWaiting + clients.claim в sw.js). Без этого слушателя
        // уже открытое окно/установленное приложение осталось бы на старых JS/CSS
        // до ручного закрытия — теперь оно перезагружает себя один раз само.
        var mtReloaded = false
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (mtReloaded) return
          mtReloaded = true
          window.location.reload()
        })
        window.addEventListener('load', function () {
          // updateViaCache: 'none' — браузер обязан брать sw.js строго с сети при
          // каждой проверке, а не из своего HTTP-кэша (им и так управляет _headers,
          // но так — без исключений на любом браузере).
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
            // На установленном на экран приложении Android/iOS просто сворачивают
            // и разворачивают вкладку — это НЕ полная перезагрузка страницы, и
            // браузер сам проверяет sw.js на обновление не всегда достаточно часто.
            // Поэтому проверяем сами: сразу и каждый раз, когда приложение снова
            // стало видимым на экране — здесь и ловится зависание на старой версии.
            reg.update().catch(function () {})
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update().catch(function () {})
            })
            window.addEventListener('focus', function () {
              reg.update().catch(function () {})
            })
          }).catch(function () {})
        })
      }
    </script>
  </body>
</html>
