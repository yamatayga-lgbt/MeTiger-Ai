<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta id="meta-theme-color" name="theme-color" content="#0A0A0C" />
    <meta name="description" content="MeTiger Ai — универсальный ИИ-агент в одном чате. Тексты, код, изображения, анализ документов и голосовые. Бесплатно, устанавливается на экран как приложение." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iOS не читает manifest.json для режима standalone — нужны отдельные мета-теги -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MeTiger Ai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MeTiger Ai — чат с ИИ</title>
    <script>
      // Тема до первого кадра — без мигания
      (function () {
        try {
          var pref = localStorage.getItem('mt-theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Service worker — только он делает иконку на главном экране «приложением»,
      // а не ещё одной закладкой браузера. /api и /telegram он не трогает (см. sw.js).
      if ('serviceWorker' in navigator) {
        // Публикуем новую версию — новый sw.js ставится в фоне и сразу берёт
        // управление (skipWaiting + clients.claim в sw.js). Без этого слушателя
        // уже открытое окно/установленное приложение осталось бы на старых JS/CSS
        // до ручного закрытия — теперь оно перезагружает себя один раз само.
        var mtReloaded = false
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (mtReloaded) return
          mtReloaded = true
          window.location.reload()
        })
        window.addEventListener('load', function () {
          // updateViaCache: 'none' — браузер обязан брать sw.js строго с сети при
          // каждой проверке, а не из своего HTTP-кэша (им и так управляет _headers,
          // но так — без исключений на любом браузере).
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
            // На установленном на экран приложении Android/iOS просто сворачивают
            // и разворачивают вкладку — это НЕ полная перезагрузка страницы, и
            // браузер сам проверяет sw.js на обновление не всегда достаточно часто.
            // Поэтому проверяем сами: сразу и каждый раз, когда приложение снова
            // стало видимым на экране — здесь и ловится зависание на старой версии.
            reg.update().catch(function () {})
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update().catch(function () {})
            })
            window.addEventListener('focus', function () {
              reg.update().catch(function () {})
            })
          }).catch(function () {})
        })
      }
    </script>
  </body>
</html>
